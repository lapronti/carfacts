<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carfacts VWE test</title><style>body{font:16px system-ui;max-width:720px;margin:50px auto;padding:20px;color:#243448}button{background:#587b26;color:white;padding:12px 22px;border:0;border-radius:8px;cursor:pointer}input{padding:12px;border:1px solid #abc;border-radius:6px}pre{white-space:pre-wrap;background:#f2f5f7;padding:20px;border-radius:8px}</style><h1>Carfacts – VWE testomgeving</h1><p>Test VWE-voertuiggegevens zonder de livewebsite te wijzigen.</p><p>Log eerst in via <a href="/admin/" target="_blank" rel="noopener">Carfacts Admin op deze testomgeving</a> (inclusief 2FA). Keer daarna terug en vraag het voertuig opnieuw op.</p><form id="f"><input id="plate" placeholder="Kenteken" value="VDZ39P" required><button>Voertuig opvragen</button></form><pre id="out">Nog geen aanvraag uitgevoerd.</pre><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('out');out.textContent='Bezig met ophalen...';try{const r=await fetch('/api/vwe-vehicle?licensePlate='+encodeURIComponent(document.getElementById('plate').value));const j=await r.json();out.textContent=JSON.stringify(j,null,2);if(r.status===401)out.textContent='Je bent nog niet ingelogd op deze Preview-omgeving. Open hierboven Carfacts Admin, log in met 2FA en probeer opnieuw.'}catch(e){out.textContent='Verbinding mislukt'}})</script></html>
