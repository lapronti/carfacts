<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carfacts VWE test</title><style>body{font:16px system-ui;max-width:720px;margin:50px auto;padding:20px;color:#243448}button{background:#587b26;color:white;padding:12px 22px;border:0;border-radius:8px;cursor:pointer}input{padding:12px;border:1px solid #abc;border-radius:6px}pre{white-space:pre-wrap;background:#f2f5f7;padding:20px;border-radius:8px;overflow:auto}.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:20px 0}.item{padding:15px;background:#f2f5f7;border:1px solid #dfe7ec;border-radius:10px}.item small{display:block;color:#627282;margin-bottom:6px}.item strong{font-size:18px}.muted{color:#64748b}details{margin-top:20px}</style><h1>Carfacts – VWE testomgeving</h1><p>Test VWE-voertuiggegevens zonder de livewebsite te wijzigen.</p><p>Log eerst in via <a href="/admin/" target="_blank" rel="noopener">Carfacts Admin op deze testomgeving</a> (inclusief 2FA). Keer daarna terug en vraag het voertuig opnieuw op.</p><form id="f"><input id="plate" placeholder="Kenteken" value="VDZ39P" required><button>Voertuig opvragen</button></form><div id="report" class="report"></div><pre id="out">Nog geen aanvraag uitgevoerd.</pre><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('out');out.textContent='Bezig met ophalen...';try{const r=await fetch('/api/vwe-vehicle?licensePlate='+encodeURIComponent(document.getElementById('plate').value));const j=await r.json();out.textContent=JSON.stringify(j,null,2);const report=document.getElementById('report');report.replaceChildren();if(r.ok&&j.vehicle){const v=j.vehicle;const items=[['Kenteken',j.licensePlate],['Merk',v.make?.name],['Model',v.model?.name],['Motorcode',v.engineCode],['Brandstof',(v.fuels||[]).map(x=>x.description).join(', ')],['Vermogen',v.power!=null?v.power+' kW / '+Math.round(v.power*1.35962)+' pk':null],['Cilinderinhoud',v.engineCapacity!=null?v.engineCapacity+' cc':null],['APK vervalt',v.motExpirationDate?.slice(0,10)],['Emissiecode',v.emissionCode],['Topsnelheid',v.maximumConstructionSpeed!=null?v.maximumConstructionSpeed+' km/u':null],['Zitplaatsen',v.numberOfSeats],['Catalogusprijs',v.listPrice!=null?'€ '+Number(v.listPrice).toLocaleString('nl-NL'):null]];for(const [label,value] of items){if(value==null||value==='')continue;const card=document.createElement('div');card.className='item';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=String(value);card.append(small,strong);report.append(card)}out.textContent='VWE-test geslaagd. De ruwe JSON is hieronder beschikbaar.'}if(r.status===401)out.textContent='Je bent nog niet ingelogd op deze Preview-omgeving. Open hierboven Carfacts Admin, log in met 2FA en probeer opnieuw.'}catch(e){out.textContent='Verbinding mislukt'}})</script></html>
