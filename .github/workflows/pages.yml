name: Deploy Carfacts to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Test live Carfacts search
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            const failures = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('requestfailed', r => failures.push(r.url()+' :: '+r.failure()?.errorText));
            page.on('console', m => { if (m.type()==='error') console.log('BROWSER CONSOLE ERROR:',m.text()); });
            const respPromise = page.waitForResponse(r => r.url().includes('carfacts-rdw.nlaghmiri.workers.dev'), {timeout:15000}).catch(()=>null);
            await page.goto('https://lapronti.github.io/carfacts/?smoke=1', {waitUntil:'networkidle', timeout:60000});
            await page.locator('#p').fill('T971VV');
            await page.locator('button[onclick="go(\'plate\')"]').click();
            const resp = await respPromise;
            await page.waitForTimeout(5000);
            console.log('RDW response:', resp ? resp.status()+' '+resp.url() : 'NONE');
            console.log('Status:', await page.locator('#s').textContent());
            console.log('Result hidden:', await page.locator('#r').evaluate(el => el.classList.contains('hidden')));
            console.log('Title:', await page.locator('#t').textContent());
            console.log('Page errors:', JSON.stringify(errors));
            console.log('Request failures:', JSON.stringify(failures));
            if (errors.length) throw new Error('Browser JavaScript error: '+errors.join(' | '));
            if (await page.locator('#r').evaluate(el => el.classList.contains('hidden'))) throw new Error('Kentekenzoekopdracht heeft geen resultaat opgeleverd.');
            if (await page.locator('#advancedTools').evaluate(el => el.classList.contains('hidden'))) throw new Error('Analyseblokken blijven verborgen.');
            console.log('SMOKE TEST OK: kenteken zoeken werkt en analyseblokken verschijnen.');
            await browser.close();
          })().catch(async e => { console.error(e); process.exit(1); });
          NODE
