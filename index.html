<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carfacts — Kentekencheck</title>
<style>
:root{--blue:#1769e0;--blue2:#0f56bd;--bg:#f3f6fa;--text:#172033;--muted:#6b7280;--line:#e6eaf0;--card:#fff;--green:#15803d;--orange:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1120px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px}.logo span{color:var(--blue)}
.badge{background:#eaf2ff;color:var(--blue);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700}
.search-card{background:linear-gradient(135deg,#fff,#f7faff);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 8px 28px rgba(23,32,51,.06)}
.search-card h1{margin:0 0 8px;font-size:26px}.search-card p{margin:0 0 20px;color:var(--muted)}
.search-row{display:flex;gap:10px;max-width:720px}
input{flex:1;padding:16px 18px;font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:1px solid #ccd3dd;border-radius:12px;background:#fff;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.12)}
button{padding:0 24px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:750;cursor:pointer}
button:hover{background:var(--blue2)}
.status{min-height:22px;margin:12px 0 0;color:var(--muted)}.err{color:#b42318;font-weight:600}
.hidden{display:none}
.hero{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(23,32,51,.05)}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.eyebrow{text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:11px;font-weight:800}.title{font-size:30px;margin:5px 0 0;letter-spacing:-.7px}.plate{background:#f7c948;color:#111827;padding:9px 14px;border-radius:8px;font-size:18px;font-weight:800;letter-spacing:1.5px;white-space:nowrap}
.value-box{margin-top:22px;padding:18px 20px;border-radius:16px;background:#f5f8fc;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.value-label{color:var(--muted);font-size:13px}.value{font-size:27px;font-weight:850}
.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.item{background:#fff;border:1px solid var(--line);padding:14px 15px;border-radius:14px;min-height:70px}.item small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.item b{font-size:15px}
.import,.notice{background:#fff;border:1px solid var(--line);padding:16px;border-radius:14px}.import.ok{border-color:#b7e4c7;background:#f3fcf6;color:var(--green)}.import.warn{border-color:#f4d19b;background:#fffaf0;color:var(--orange)}
footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.container{padding:18px 12px 40px}.search-row{flex-direction:column}button{height:52px}.hero-top{flex-direction:column}.plate{align-self:flex-start}.grid{grid-template-columns:1fr 1fr}.title{font-size:24px}.value{font-size:23px}}
</style>
</head>
<body>
<div class="container">
<header><div class="logo">Car<span>facts</span></div><div class="badge">RDW KENTEKENCHECK</div></header>

<section class="search-card">
<h1>Controleer een voertuig</h1>
<p>Vul een Nederlands kenteken in en bekijk de beschikbare voertuiggegevens.</p>
<div class="search-row">
<input id="p" placeholder="12-AB-34" maxlength="8" autocomplete="off">
<button onclick="go()">Kenteken zoeken</button>
</div>
<div id="s" class="status"></div>
</section>

<div id="r" class="hidden">
<section class="hero">
<div class="hero-top">
<div><div class="eyebrow">Voertuig</div><div id="t" class="title"></div></div>
<div id="plate" class="plate"></div>
</div>
<div class="value-box">
<div><div class="value-label">Cataloguswaarde</div><div class="value" id="price">—</div></div>
<div style="font-size:24px">€</div>
</div>
</section>

<section class="section">
<h2>Voertuiggegevens</h2>
<div id="g" class="grid"></div>
</section>

<section class="section">
<h2>Importcontrole</h2>
<div id="i" class="import"></div>
</section>

<section class="section">
<h2>Kilometerstand & APK</h2>
<div id="f" class="grid"></div>
</section>
</div>

<footer>Bron: RDW Open Data · Carfacts</footer>
</div>

<script>
const A='https://opendata.rdw.nl/resource/m9d7-ebf2.json';
const q=x=>document.getElementById(x);
const v=x=>x==null||x===''?'—':x;

function formatDate(x){
  if(x==null||x==='') return '—';
  const s=String(x).replace(/[^0-9]/g,'');
  if(s.length===8){
    return s.slice(6,8)+'-'+s.slice(4,6)+'-'+s.slice(0,4);
  }
  return x;
}

function formatEuro(x){
  if(x==null||x==='') return '—';
  const n=Number(String(x).replace(/[^0-9.-]/g,''));
  if(!Number.isFinite(n)) return x;
  return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
}

function it(a,b){
  return '<div class="item"><small>'+a+'</small><b>'+v(b)+'</b></div>';
}

async function go(){
  const k=q('p').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!k){q('s').innerHTML='<span class="err">Vul eerst een kenteken in.</span>';return}
  q('s').textContent='RDW gegevens ophalen…';
  q('r').classList.add('hidden');
  try{
    const z=await fetch(A+'?kenteken='+encodeURIComponent(k));
    if(!z.ok) throw Error('RDW is tijdelijk niet bereikbaar');
    const a=await z.json();
    if(!a.length) throw Error('Kenteken niet gevonden');
    const x=a[0];

    q('r').classList.remove('hidden');
    q('s').textContent='';
    q('t').textContent=(v(x.merk)+' '+v(x.handelsbenaming)).trim();
    q('plate').textContent=v(x.kenteken);
    q('price').textContent=formatEuro(x.catalogusprijs);

    q('g').innerHTML=[
      it('Kenteken',x.kenteken),
      it('Voertuigsoort',x.voertuigsoort),
      it('Brandstof',x.brandstof),
      it('Cilinderinhoud',x.cilinderinhoud?Number(x.cilinderinhoud).toLocaleString('nl-NL')+' cc':null),
      it('Massa rijklaar',x.massa_rijklaar?Number(x.massa_rijklaar).toLocaleString('nl-NL')+' kg':null),
      it('Eerste toelating',formatDate(x.datum_eerste_toelating)),
      it('Eerste tenaamstelling NL',formatDate(x.datum_eerste_tenaamstelling_in_nederland)),
      it('Bruto BPM',formatEuro(x.bruto_bpm)),
      it('CO₂-uitstoot',x.co2_emissie?x.co2_emissie+' g/km':null)
    ].join('');

    const im=x.datum_eerste_toelating&&x.datum_eerste_tenaamstelling_in_nederland&&String(x.datum_eerste_toelating)!==String(x.datum_eerste_tenaamstelling_in_nederland);
    q('i').className='import '+(im?'warn':'ok');
    q('i').textContent=im?'Waarschijnlijk importauto: de eerste toelating en de eerste Nederlandse tenaamstelling verschillen.':'Geen importsignaal op basis van de beschikbare RDW-datums.';

    q('f').innerHTML=[
      it('Tellerstandoordeel',x.tellerstandoordeel),
      it('Laatste geregistreerde tellerstand',x.jaar_laatste_registratie_tellerstand),
      it('APK geldig tot',formatDate(x.vervaldatum_apk)),
      it('Bruto BPM',formatEuro(x.bruto_bpm))
    ].join('');
  }catch(e){
    q('s').innerHTML='<span class="err">Zoeken mislukt: '+e.message+'</span>';
  }
}

q('p').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body>
</html>
