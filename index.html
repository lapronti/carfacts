<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carfacts</title><style>body{font-family:Arial;max-width:1000px;margin:auto;padding:30px;background:#f4f6f8;color:#17202a}.card{background:white;padding:24px;border-radius:16px;margin:16px 0}input{padding:14px;font-size:20px;width:60%;text-transform:uppercase}button{padding:15px;background:#1976d2;color:white;border:0;border-radius:8px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.x{background:#f5f7f9;padding:12px;border-radius:8px}.hidden{display:none}.err{color:#b42318}</style></head><body><h1>Car<span style="color:#1976d2">facts</span></h1><div class="card"><h2>Kentekencheck</h2><input id="p" placeholder="12-AB-34"><button onclick="go()">Zoeken</button><p id="s"></p></div><div id="r" class="hidden"><div class="card"><h2 id="t"></h2><div id="g" class="grid"></div></div><div class="card"><h2>🇳🇱 Importcontrole</h2><div id="i"></div></div><div class="card"><h2>📊 Kilometer / NAP</h2><div id="f" class="grid"></div></div></div><script>const A='https://opendata.rdw.nl/resource/m9d7-ebf2.json',q=x=>document.getElementById(x),v=x=>x==null||x===''?'—':x,it=(a,b)=>'<div class=x><small>'+a+'</small><br><b>'+v(b)+'</b></div>';async function go(){let k=q('p').value.toUpperCase().replace(/[^A-Z0-9]/g,'');q('s').textContent='RDW gegevens ophalen…';try{let z=await fetch(A+'?kenteken='+k),a=await z.json();if(!a.length)throw Error('Kenteken niet gevonden');let x=a[0];q('r').classList.remove('hidden');q('s').textContent='';q('t').textContent=v(x.merk)+' '+v(x.handelsbenaming);q('g').innerHTML=[it('Kenteken',x.kenteken),it('Voertuigsoort',x.voertuigsoort),it('Brandstof',x.brandstof),it('Cilinderinhoud',x.cilinderinhoud?x.cilinderinhoud+' cc':null),it('Massa rijklaar',x.massa_rijklaar?x.massa_rijklaar+' kg':null),it('Eerste toelating',x.datum_eerste_toelating),it('Catalogusprijs',x.catalogusprijs)].join('');let im=x.datum_eerste_toelating&&x.datum_eerste_tenaamstelling_in_nederland&&String(x.datum_eerste_toelating)!=String(x.datum_eerste_tenaamstelling_in_nederland);q('i').textContent=im?'Waarschijnlijk importauto':'Geen importsignaal op basis van de beschikbare datums';q('f').innerHTML=[it('Tellerstandoordeel',x.tellerstandoordeel),it('APK geldig tot',x.vervaldatum_apk),it('Bruto BPM',x.bruto_bpm),it('CO₂',x.co2_emissie?x.co2_emissie+' g/km':null)].join('')}catch(e){q('s').innerHTML='<span class=err>Zoeken mislukt: '+e.message+'</span>'}}</script></body></html>
