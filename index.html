<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carfacts — Kentekencheck</title>
<style>
body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}
.wrap{max-width:1050px;margin:auto;padding:28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-size:28px;font-weight:800}.logo span{color:#1976d2}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 5px 24px #0000000d;margin-bottom:18px}
.search{display:flex;gap:10px}.search input{flex:1;font-size:22px;padding:14px;border:1px solid #ccd3da;border-radius:10px;text-transform:uppercase}
button{background:#1976d2;color:white;border:0;border-radius:10px;padding:14px 22px;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.muted{color:#68737d}.error{color:#b42318;background:#fff1f0;padding:12px;border-radius:9px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.item{background:#f7f9fb;padding:14px;border-radius:10px}.label{font-size:12px;color:#68737d}.value{font-size:17px;font-weight:700;margin-top:4px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:700;font-size:13px}
.green{background:#e7f7ed;color:#137333}.orange{background:#fff3d6;color:#8a5700}.red{background:#ffe7e5;color:#b42318}
h2{margin-top:0}.hidden{display:none}
select{width:100%;padding:12px;border:1px solid #ccd3da;border-radius:9px;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">Car<span>facts</span></div><div class="muted">Kentekeninformatie</div></header>
<div class="card">
<h2>Controleer een voertuig</h2>
<div class="search"><input id="plate" maxlength="8" placeholder="Bijv. 12-AB-34"><button id="search">Zoeken</button></div>
<div id="status"></div>
</div>
<div id="result" class="hidden">
<div class="card"><h2 id="title"></h2><div id="summary" class="grid"></div></div>
<div class="card"><h2>🇳🇱 Importcontrole</h2><div id="import"></div></div>
<div class="card"><h2>📊 Kilometer / NAP</h2><div id="km" class="grid"></div></div>
<div class="card"><h2>🔧 APK & fiscale gegevens</h2><div id="fiscal" class="grid"></div></div>
<div class="card"><h2>💰 MRB per provincie</h2><p class="muted">Kies je provincie voor een indicatieve berekening. Tarieven moeten jaarlijks worden bijgewerkt.</p><select id="province"></select><div id="mrb" style="margin-top:14px"></div></div>
<div class="card"><h2>⚠️ Carfacts signalen</h2><div id="alerts"></div></div>
</div>
</div>
<script>
const API="https://opendata.rdw.nl/resource/m9d7-ebf2.json";
const provinces=["Drenthe","Flevoland","Friesland","Gelderland","Groningen","Limburg","Noord-Brabant","Noord-Holland","Overijssel","Utrecht","Zeeland","Zuid-Holland"];
const provinceOpcenten={Drenthe:95.7,Flevoland:82.0,Friesland:98.3,Gelderland:101.5,Groningen:96.9,Limburg:96.9,"Noord-Brabant":80.5,"Noord-Holland":67.9,Overijssel:82.8,Utrecht:79.9,Zeeland:95.0,"Zuid-Holland":95.0};
for(const p of provinces) province.innerHTML+=`<option>${p}</option>`;

const fmt=(v)=>v==null||v===""?"—":String(v);
const money=v=>v==null||v===""?"—":"€ "+Number(v).toLocaleString("nl-NL");
const date=v=>{if(!v)return"—";let s=String(v);if(/^\d{8}$/.test(s))return `${s.slice(6,8)}-${s.slice(4,6)}-${s.slice(0,4)}`;return new Date(s).toLocaleDateString("nl-NL")};
function item(l,v){return `<div class="item"><div class="label">${l}</div><div class="value">${fmt(v)}</div></div>`}
function cleanPlate(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,"")}
function setStatus(t,err=false){status.innerHTML=err?`<div class="error">${t}</div>`:`<p class="muted">${t}</p>`}

async function lookup(){
 const kenteken=cleanPlate(plate.value);
 if(!kenteken){setStatus("Vul een kenteken in.",true);return}
 search.disabled=true; result.classList.add("hidden"); setStatus("RDW-gegevens ophalen…");
 try{
   const url=API+"?kenteken="+encodeURIComponent(kenteken);
   const r=await fetch(url,{headers:{Accept:"application/json"}});
   if(!r.ok) throw new Error("RDW antwoordde met HTTP "+r.status);
   const rows=await r.json();
   if(!rows.length) throw new Error("Kenteken niet gevonden in de RDW Open Data.");
   render(rows[0]); setStatus("");
 }catch(e){setStatus("Zoeken mislukt: "+e.message+" Als je dit bestand rechtstreeks opent, kan je browser RDW-verzoeken blokkeren. Open het via een gratis webhost.",true)}
 finally{search.disabled=false}
}
function render(d){
 result.classList.remove("hidden");
 title.textContent=`${fmt(d.merk)} ${fmt(d.handelsbenaming)}`;
 summary.innerHTML=[
 item("Kenteken",d.kenteken),item("Voertuigsoort",d.voertuigsoort),item("Brandstof",d.brandstof),item("Cilinderinhoud",d.cilinderinhoud?d.cilinderinhoud+" cc":null),
 item("Vermogen",d.v_topsnelheid?d.v_topsnelheid:null),item("Massa rijklaar",d.massa_rijklaar?d.massa_rijklaar+" kg":d.massa_ledig_voertuig?d.massa_ledig_voertuig+" kg":null),
 item("Eerste toelating",date(d.datum_eerste_toelating)),item("Catalogusprijs",money(d.catalogusprijs))
 ].join("");
 const first=d.datum_eerste_toelating, nl=d.datum_eerste_tenaamstelling_in_nederland;
 const imported=first&&nl&&String(first)!==String(nl);
 import.innerHTML=imported?`<span class="badge orange">⚠️ Waarschijnlijk importauto</span><p>Eerste toelating: <b>${date(first)}</b><br>Eerste tenaamstelling in Nederland: <b>${date(nl)}</b></p>`:`<span class="badge green">🇳🇱 Geen importsignaal op basis van deze datums</span>`;
 km.innerHTML=[item("Tellerstandoordeel",d.tellerstandoordeel),item("Laatste tellerregistratie",d.jaar_laatste_registratie_tellerstand),item("Code toelichting",d.code_toelichting_tellerstandoordeel)].join("");
 fiscal.innerHTML=[item("APK geldig tot",date(d.vervaldatum_apk)),item("Bruto BPM",money(d.bruto_bpm)),item("CO₂",d.co2_emissie?d.co2_emissie+" g/km":null),item("Massa ledig",d.massa_ledig_voertuig?d.massa_ledig_voertuig+" kg":null)].join("");
 const alerts=[];
 if(imported)alerts.push("⚠️ Importauto: Nederlandse tellerhistorie kan daardoor beperkter zijn.");
 if(String(d.tellerstandoordeel||"").toLowerCase().includes("onlogisch"))alerts.push("🔴 RDW geeft een onlogisch tellerstandoordeel.");
 if(d.bruto_bpm && d.catalogusprijs && Number(d.bruto_bpm)>Number(d.catalogusprijs)*.4)alerts.push("🟠 BPM is relatief hoog ten opzichte van de catalogusprijs; dit is alleen een signaal, geen fraudevaststelling.");
 if(!alerts.length)alerts.push("🟢 Geen opvallend signaal gevonden met de beschikbare RDW-gegevens.");
 document.getElementById("alerts").innerHTML=alerts.map(x=>`<p>${x}</p>`).join("");
 window.current=d; calcMrb();
}
function calcMrb(){
 const d=window.current;if(!d)return;
 const mass=Number(d.massa_rijklaar||d.massa_ledig_voertuig||0);
 const fuel=String(d.brandstof||"").toLowerCase();
 const electric=fuel.includes("elektr");
 const diesel=fuel.includes("diesel");
 const p=province.value;
 if(!mass){mrb.innerHTML="<div class='error'>Geen massa beschikbaar voor een betrouwbare MRB-indicatie.</div>";return}
 // This is deliberately an indication, not an official tax assessment.
 // Base bands are placeholders until the exact 2026 Belastingdienst tables are wired in.
 let base=mass<=550?35:mass<=650?48:mass<=750?61:mass<=850?74:mass<=950?88:mass<=1050?102:mass<=1150?117:mass<=1250?133:mass<=1350?149:mass<=1450?166:mass<=1550?184:mass<=1650?203:mass<=1750?223:mass<=1850?244:mass<=1950?266:mass<=2050?289:mass<=2150?313:338;
 let quarter=base*(1+provinceOpcenten[p]/100);
 if(diesel)quarter+=Math.max(0,mass-800)*0.03;
 if(electric)quarter*=.70;
 mrb.innerHTML=`<div class="grid">${item("Provincie",p)}${item("Massa gebruikt",mass+" kg")}${item("Indicatie per kwartaal",money(quarter))}${item("Indicatie per jaar",money(quarter*4))}</div><p class="muted">Dit is een Carfacts-indicatie en geen aanslag van de Belastingdienst.</p>`;
}
search.onclick=lookup; plate.addEventListener("keydown",e=>{if(e.key==="Enter")lookup()}); province.onchange=calcMrb;
</script>
</body></html>
